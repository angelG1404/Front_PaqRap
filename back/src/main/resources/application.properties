# 8081 por defecto (en algunos equipos Windows el 8080 lo ocupa un servicio del sistema). Se cambia con PORT.
server.port=${PORT:8081}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
# Orígenes permitidos para REST y /ws (separados por comas). En producción, restringir al dominio del front.
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

# --- Motor de simulación ---
# Un tick (snapshot por WebSocket) cada tick-ms milisegundos reales.
paqrap.sim.tick-ms=1000
# Minutos simulados por minuto real. 5D: 160x => 5 días en 45 min (rango pedido: 30-60 min).
# Para una prueba rápida se puede subir (p. ej. 1440x => 5 días en 5 min).
paqrap.sim.factor.diario=${PAQRAP_FACTOR_DIARIO:1}
paqrap.sim.factor.5d=${PAQRAP_FACTOR_5D:160}
paqrap.sim.factor.colapso=${PAQRAP_FACTOR_COLAPSO:480}

# --- Planificador (ALNS / ATS por lotes, en un hilo aparte) ---
# Minutos simulados mínimos entre planificaciones (un pedido nuevo en DIARIO replanifica de inmediato).
paqrap.plan.intervalo-min.diario=1
paqrap.plan.intervalo-min.simulacion=5
# Tiempo real máximo por ejecución del algoritmo y tamaño máximo del lote.
paqrap.plan.limite-ms=1500
paqrap.plan.max-iteraciones=250
paqrap.plan.max-pedidos=60

# La operación diaria arranca sola al levantar el servidor para que cualquier dispositivo la encuentre.
paqrap.diario.auto-iniciar=true
paqrap.diario.algoritmo=ALNS
